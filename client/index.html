<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học tiếng Nga - Realtime STT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 820px;
            margin: 36px auto;
            padding: 0 20px;
            background: #f0f2f5;
            color: #1a1a2e;
        }

        h2 { text-align: center; color: #2c3e50; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 18px; }

        #status {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #fef3cd;
            color: #856404;
            transition: all 0.3s;
        }
        #status.ok   { background: #d1f0e0; color: #155724; }
        #status.rec  { background: #fde8e8; color: #721c24; }
        #status.err  { background: #f8d7da; color: #721c24; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 11px 26px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        #btn-record { background: #27ae60; color: #fff; }
        #btn-record.recording { background: #e74c3c; animation: pulse 1.4s infinite; }
        #btn-clear  { background: #95a5a6; color: #fff; }
        #btn-save   { background: #2980b9; color: #fff; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.04); }
        }

        .transcript-container {
            background: #fff;
            border: 1px solid #dce1e9;
            border-radius: 12px;
            padding: 16px;
            height: 400px;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .text-line {
            padding: 9px 14px;
            background: #f8fafc;
            border-left: 4px solid #2980b9;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

        #interim-line {
            color: #888;
            font-style: italic;
            border-left-color: #bdc3c7;
            background: #fafafa;
            min-height: 36px;
        }

        .empty-hint {
            color: #aaa;
            font-style: italic;
            text-align: center;
            margin: auto;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h2>Luyện Nói Tiếng Nga Real-time</h2>
<p class="subtitle">Vosk offline · model-small · WebSocket → FastAPI local</p>

<div id="status">Đang kết nối tới server...</div>

<div class="controls">
    <button id="btn-record" disabled>▶ Bắt đầu nói</button>
    <button id="btn-clear">🗑 Xóa</button>
    <button id="btn-save">💾 Lưu .txt</button>
</div>

<div class="transcript-container" id="transcript-box">
    <div id="interim-line" class="text-line" style="display:none"></div>
    <div class="empty-hint" id="empty-hint">Nhấn "Bắt đầu nói" rồi nói tiếng Nga…</div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const WS_URL      = 'ws://localhost:8001/ws/stream';
const TARGET_SR   = 16000;   // Vosk yêu cầu 16kHz
const CHUNK_MS    = 250;     // gửi mỗi 250ms — đủ nhỏ cho partial realtime

// ── State ────────────────────────────────────────────────────────────────────
let ws, audioCtx, mediaStream, scriptProcessor;
let isRecording    = false;
let finalLines     = [];
let pendingBuffer  = [];   // gom samples trước khi gửi

// ── DOM ───────────────────────────────────────────────────────────────────────
const btnRecord    = document.getElementById('btn-record');
const btnClear     = document.getElementById('btn-clear');
const btnSave      = document.getElementById('btn-save');
const transcriptBox= document.getElementById('transcript-box');
const interimLine  = document.getElementById('interim-line');
const statusDiv    = document.getElementById('status');
const emptyHint    = document.getElementById('empty-hint');

// ── Status helper ─────────────────────────────────────────────────────────────
function setStatus(msg, cls='') {
    statusDiv.textContent = msg;
    statusDiv.className   = cls;
}

// ── WebSocket ────────────────────────────────────────────────────────────────
function connectWS() {
    ws = new WebSocket(WS_URL);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        setStatus('✅ Đã kết nối server. Sẵn sàng!', 'ok');
        btnRecord.disabled = false;
    };

    ws.onclose = () => {
        setStatus('⚠️ Mất kết nối. Đảm bảo server.py đang chạy!', 'err');
        stopRecording();
        btnRecord.disabled = true;
        // Tự reconnect sau 3s
        setTimeout(connectWS, 3000);
    };

    ws.onerror = () => {
        setStatus('❌ Không kết nối được server (port 8001). Chạy server.py trước!', 'err');
    };

    ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);

        if (data.type === 'partial') {
            emptyHint.style.display = 'none';
            interimLine.style.display = 'block';
            interimLine.textContent   = '… ' + data.text;
            scrollBottom();

        } else if (data.type === 'final') {
            interimLine.style.display = 'none';
            appendFinalLine(data.text);

        } else if (data.type === 'error') {
            setStatus('⚠️ ' + data.text, 'err');
        }
    };
}

// ── Audio capture ─────────────────────────────────────────────────────────────
async function startRecording() {
    try {
        // Capture ở sample rate native của hardware (không ép 16kHz — browser thường bỏ qua)
        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
            }
        });

        // AudioContext ở native rate — resample về 16kHz thủ công
        const nativeSR = mediaStream.getAudioTracks()[0].getSettings().sampleRate || 48000;
        audioCtx       = new AudioContext({ sampleRate: nativeSR });
        const ratio    = nativeSR / TARGET_SR;   // e.g. 48000/16000 = 3

        const source   = audioCtx.createMediaStreamSource(mediaStream);

        // ScriptProcessor với buffer lớn hơn — ít bị drop hơn trên main thread
        const bufSize  = 4096;
        scriptProcessor = audioCtx.createScriptProcessor(bufSize, 1, 1);

        // Gom samples, resample, gửi mỗi CHUNK_MS
        const samplesPerChunk = Math.floor(TARGET_SR * CHUNK_MS / 1000);  // 250ms = 4000 samples
        pendingBuffer = [];

        scriptProcessor.onaudioprocess = (e) => {
            if (!isRecording) return;

            const input    = e.inputBuffer.getChannelData(0);

            // Downsample bằng linear interpolation — chất lượng tốt hơn drop sample
            const outLen   = Math.floor(input.length / ratio);
            for (let i = 0; i < outLen; i++) {
                const pos  = i * ratio;
                const idx  = Math.floor(pos);
                const frac = pos - idx;
                const s    = idx + 1 < input.length
                    ? input[idx] * (1 - frac) + input[idx + 1] * frac
                    : input[idx];
                pendingBuffer.push(s);
            }

            // Gửi khi đủ chunk
            while (pendingBuffer.length >= samplesPerChunk) {
                const chunk = pendingBuffer.splice(0, samplesPerChunk);
                sendPCM16(chunk);
            }
        };

        source.connect(scriptProcessor);
        scriptProcessor.connect(audioCtx.destination);

        isRecording = true;
        btnRecord.textContent = '⏹ Dừng';
        btnRecord.className   = 'recording';
        setStatus('🔴 Đang nghe… hãy nói tiếng Nga!', 'rec');

    } catch (err) {
        setStatus('❌ Không truy cập được microphone: ' + err.message, 'err');
    }
}

function sendPCM16(float32Samples) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    // Convert float32 [-1,1] → int16
    const int16 = new Int16Array(float32Samples.length);
    for (let i = 0; i < float32Samples.length; i++) {
        const s  = Math.max(-1, Math.min(1, float32Samples[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    ws.send(int16.buffer);
}

function stopRecording() {
    if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
    if (mediaStream)      { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioCtx)         { audioCtx.close().catch(()=>{}); audioCtx = null; }

    pendingBuffer  = [];
    isRecording    = false;
    btnRecord.textContent = '▶ Bắt đầu nói';
    btnRecord.className   = '';
    interimLine.style.display = 'none';
    if (!isRecording) setStatus('⏸ Đã dừng. Nhấn để ghi lại.', 'ok');
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function appendFinalLine(text) {
    emptyHint.style.display = 'none';
    finalLines.push(text);

    const p    = document.createElement('p');
    p.className = 'text-line';
    const ts   = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    p.textContent = `[${ts}]  ${text}`;

    // Chèn trước interimLine để interim luôn nằm dưới cùng
    transcriptBox.insertBefore(p, interimLine);
    scrollBottom();
}

function scrollBottom() {
    transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

// ── Buttons ───────────────────────────────────────────────────────────────────
btnRecord.addEventListener('click', () => {
    if (isRecording) {
        stopRecording();
    } else {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            setStatus('⏳ Đang kết nối lại…');
            connectWS();
            setTimeout(startRecording, 600);
        } else {
            startRecording();
        }
    }
});

btnClear.addEventListener('click', () => {
    // Xóa tất cả p.text-line trừ interimLine
    Array.from(transcriptBox.querySelectorAll('p.text-line:not(#interim-line)')).forEach(el => el.remove());
    interimLine.style.display = 'none';
    emptyHint.style.display   = '';
    finalLines = [];
});

btnSave.addEventListener('click', () => {
    if (finalLines.length === 0) {
        alert('Chưa có nội dung để lưu!');
        return;
    }
    const blob = new Blob([finalLines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `tieng_nga_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
});

// ── Init ──────────────────────────────────────────────────────────────────────
connectWS();
</script>
</body>
</html>
